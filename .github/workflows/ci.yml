name: CI

on:
  push:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/nightly.yml"
      - "build.zig"
      - "build.zig.zon"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "benchmarks/**"
      - "tools/**"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/nightly.yml"
      - "build.zig"
      - "build.zig.zon"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "benchmarks/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.17.0-dev.1413+addc3c3b8

jobs:
  test:
    name: Debug tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src benchmarks tests examples
      - name: Run deterministic test suite
        run: zig build test -j1 --summary all
      - name: Compile all check artifacts
        run: zig build check -j1 --summary all

  release-safe:
    name: ReleaseSafe tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test -Doptimize=ReleaseSafe -j1 --summary all

  fuzz-seeds:
    name: ${{ matrix.step }} seeds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        step:
          - http1-fuzz
          - http2-fuzz
          - http3-fuzz
          - quic-fuzz
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: fuzz-${{ matrix.step }}
      - run: zig build ${{ matrix.step }} -j1 --summary all

  http3-interop:
    name: HTTP/3 aioquic interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned aioquic
        run: python -m pip install aioquic==1.3.0
      - name: Run interoperability matrix
        shell: bash
        run: |
          set -euo pipefail
          timeout 150s zig build example-http3 > http3-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          timeout 120s python tools/http3_interop.py
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: http3-interop-server-log
          path: http3-server.log
          if-no-files-found: ignore
